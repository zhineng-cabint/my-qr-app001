
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能寄存柜</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; background: #f5f6f8; margin: 0;
    min-height: 100vh;
  }
  h2 { margin: 0 0 8px; font-size: 22px; color: #222; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
  
  #qrcode {
    width: 272px; height: 272px; display: flex; align-items: center;
    justify-content: center; background: #fff; padding: 8px;
    border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    margin-bottom: 24px;
  }
  
  #tip { color: #1677ff; font-size: 15px; font-weight: 500; text-align: center; line-height: 1.6; }
  .warn { color: #d4380d; font-size: 12px; margin-top: 12px; text-align: center; max-width: 320px; }
</style>
</head>
<body>
  <h2>智能寄存柜</h2>
  <p class="sub">请将下方二维码对准柜子扫码器</p >

  <div id="qrcode"></div>
  
  <p id="tip">扫码即可开柜（未存过自动存，存过自动取）</p >
  <p class="warn">该码限存件一次、取件一次</p >

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // 1. 获取或生成持久唯一标识（这代表“你这个人”）
    function getUserKey() {
      var KEY = 'cabinet_user_key';
      var key = localStorage.getItem(KEY);
      if (!key) {
        var arr = new Uint8Array(8);
        crypto.getRandomValues(arr);
        key = Array.from(arr, function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('').toUpperCase();
        localStorage.setItem(KEY, key);
      }
      return key;
    }

    // 2. 渲染二维码（用户ID + 随机时间戳 = 每次刷新都不一样）
    function renderQR() {
      var uuid = getUserKey(); 
      var timestamp = Date.now();
      
      // 最终的内容格式，例如：A1B2C3D4-1761738291456
      var content = uuid + '-' + timestamp; 

      var container = document.getElementById('qrcode');
      container.innerHTML = '';
      new QRCode(container, {
        text: content,
        width: 256,
        height: 256,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // 3. 页面打开自动生成
    window.onload = function() {
      renderQR();
    };
  </script>
</body>
</html>
