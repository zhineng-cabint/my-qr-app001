<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能寄存柜</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 20px; background: #f5f6f8; margin: 0;
    min-height: 100vh;
  }
  h2 { margin: 0 0 8px; font-size: 22px; color: #222; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
  .btns { display: flex; gap: 16px; margin-bottom: 24px; width: 100%; max-width: 340px; }
  button {
    flex: 1; font-size: 18px; padding: 14px 0; border: none;
    border-radius: 10px; cursor: pointer; color: #fff; font-weight: 600;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  .btn-store { background: #1677ff; }
  .btn-take  { background: #52c41a; }
  
  #qrcode {
    width: 272px; height: 272px; display: flex; align-items: center;
    justify-content: center; background: #fff; padding: 8px;
    border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    position: relative; overflow: hidden;
  }
  
  /* 增加一个加载动画遮罩 */
  .loading-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.8); display: none;
    align-items: center; justify-content: center; font-size: 16px; color: #666;
  }
  
  #tip { color: #888; margin-top: 18px; font-size: 15px; font-weight: 500; text-align: center; line-height: 1.6; transition: color 0.3s; }
  .warn { color: #d4380d; font-size: 12px; margin-top: 12px; text-align: center; max-width: 320px; }
</style>
</head>
<body>
  <h2>智能寄存柜</h2>
  <p class="sub">请将下方二维码对准柜子扫码器</p >

  <div class="btns">
    <button class="btn-store" onclick="renderQR('store')">存</button>
    <button class="btn-take"  onclick="renderQR('take')">取</button>
  </div>

  <div id="qrcode">
    <div id="mask" class="loading-mask">正在生成...</div>
  </div>
  <p id="tip">二维码已准备就绪，请对准柜子扫码口</p >
  <p class="warn">请勿清除微信缓存或更换手机，否则将无法取件</p >

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    function getUserKey() {
      var KEY = 'cabinet_user_key';
      var key = localStorage.getItem(KEY);
      if (!key) {
        var arr = new Uint8Array(16);
        crypto.getRandomValues(arr);
        key = Array.from(arr, function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('').toUpperCase();
        localStorage.setItem(KEY, key);
      }
      return key;
    }

    // 修改了这里，接收一个 type 参数，用来判断是存还是取
    function renderQR(type) {
      var mask = document.getElementById('mask');
      var tip = document.getElementById('tip');
      
      // 1. 显示加载遮罩，给用户明确反馈
      mask.style.display = 'flex';
      tip.textContent = '正在生成专属凭证...';
      tip.style.color = '#1677ff';

      // 2. 延迟 300 毫秒生成，让用户能看到反应
      setTimeout(function() {
        var content = getUserKey(); 
        var container = document.getElementById('qrcode');
        
        // 清除旧的二维码（保留遮罩层）
        var oldQR = container.querySelector('img') || container.querySelector('canvas');
        if(oldQR) oldQR.remove();

        new QRCode(container, {
          text: content,
          width: 256,
          height: 256,
          correctLevel: QRCode.CorrectLevel.H
        });

        // 3. 隐藏遮罩，根据点击的按钮改变提示文字和颜色
        mask.style.display = 'none';
        if (type === 'store') {
          tip.textContent = '✅ 【存件码】已生成，请对准扫码口';
          tip.style.color = '#1677ff';
        } else if (type === 'take') {
          tip.textContent = '✅ 【取件码】已生成，请对准扫码口';
          tip.style.color = '#52c41a';
        } else {
          // 页面初次加载时的默认提示
          tip.textContent = '二维码已准备就绪，请对准柜子扫码口';
          tip.style.color = '#888';
        }
      }, 300);
    }

    // 页面初次打开时，自动生成
    window.onload = function() {
      renderQR('init');
    };
  </script>
</body>
</html>
